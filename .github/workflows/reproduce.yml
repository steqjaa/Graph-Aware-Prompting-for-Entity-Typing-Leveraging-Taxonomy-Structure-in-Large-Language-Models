name: Verify final-study reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/final-analysis.txt
      - run: python -m pip install -r requirements/final-analysis.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/prepare_final_prompts.py --output rebuilt-prompts
      - run: python scripts/reproduce_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-study-analysis
          path: results/derived/final/
