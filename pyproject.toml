[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-aware-entity-typing"
version = "0.1.0"
description = "Offline reproduction of the final graph-aware entity-typing study"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "networkx>=3.0", "matplotlib>=3.7"]

[project.scripts]
graph-typing-reproduce = "graph_typing.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
